# Throwaway Postgres for the backend performance audit (docs/perf-audit/PERF_REPORT.md).
# Holds a copy of `proact` (perf-audit/clone-db.sh) so benchmarks and load tests never touch the plant
# database. Same server settings as proact-postgres (DB audit F08/F14), durable writes (fsync on) so write
# timings are realistic; data lives in the container and goes away with `down`.
#
#   docker compose -p proact-perf -f perf-audit/docker-compose.perf.yml up -d --wait
#   docker compose -p proact-perf -f perf-audit/docker-compose.perf.yml down
services:
  postgres-perf:
    image: postgres:15-alpine
    container_name: proact-perf-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - shared_buffers=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
      - -c
      - max_connections=100
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
