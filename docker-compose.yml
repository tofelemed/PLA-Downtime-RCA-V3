# Pro-Act: frontend (nginx + static Vite build), backend API, worker, Postgres, Kafka and MQTT.
#
#   cp .env.example .env            # set POSTGRES_PASSWORD and JWT_SECRET
#   docker compose up -d --build
#   docker compose exec backend node dist/scripts/seed-demo-users.js   # login-page demo accounts
#   docker compose --profile tools up -d kafka-ui                      # optional Kafka UI
#
# Frontend: http://localhost:${FRONTEND_PORT:-8070}  (API and Socket.IO are proxied under the same origin; uploads download through /api with a token)
# Backend:  http://localhost:${BACKEND_PORT:-4004}/api/health, Swagger at /api
# Kafka:    localhost:${KAFKA_PORT:-9092} from the host, kafka:29092 from other containers
# MQTT:     mqtt://localhost:${MQTT_PORT:-1884} from the host, mqtt://mqtt:1883 from other containers
#           password listener mqtt://localhost:${MQTT_AUTH_PORT:-1885}, TLS mqtts://localhost:${MQTT_TLS_PORT:-8885} (docker/mosquitto/)
#
# Overrides (combine with -f docker-compose.yml -f <override>):
#   docker-compose.external-db.yml    reuse the shared instrumental-postgres container
#   docker-compose.shared-infra.yml   reuse the host's instrumental-kafka-1 / mosquitto containers
#
# Details: docs/DOCKER.md
name: proact

# Shared by the API and worker services: one image, one database/broker configuration.
x-backend-build: &backend-build
  context: ./server/pro-act-backend

x-backend-env: &backend-env
  NODE_ENV: production
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_USERNAME: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  DB_NAME: ${POSTGRES_DB:-proact}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  # Refresh tokens are signed with their own key (plan 3.11, owner decision 2026-10-10)
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env (different from JWT_SECRET)}
  # Registration is admin-only unless explicitly opened (local dev / e2e)
  AUTH_ALLOW_PUBLIC_REGISTRATION: ${AUTH_ALLOW_PUBLIC_REGISTRATION:-false}
  # Encrypts PI/connector credentials at rest; falls back to JWT_SECRET when empty
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
  # Named credential keys for rotation ("id:secret,...") and the current one (plan 3.11)
  CREDENTIAL_ENCRYPTION_KEYS: ${CREDENTIAL_ENCRYPTION_KEYS:-}
  CREDENTIAL_ENCRYPTION_KEY_ID: ${CREDENTIAL_ENCRYPTION_KEY_ID:-}
  # Hosts PI connector / proxy calls may reach (empty = unrestricted; set it in production)
  CONNECTOR_EGRESS_ALLOWLIST: ${CONNECTOR_EGRESS_ALLOWLIST:-}
  # Message brokers as seen from inside the containers (docker-compose.shared-infra.yml points them at the host's)
  KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
  MQTT_URL: ${MQTT_URL:-mqtt://mqtt:1883}
  # nginx on the private Docker network is the only proxy in front of the API: client IPs come from
  # X-Forwarded-For (per-IP rate limits of login / refresh; perf audit P11)
  TRUST_PROXY: ${TRUST_PROXY:-loopback, uniquelocal}
  # Prometheus metrics of the API on this port inside the network (GET /metrics); empty = off. Never
  # publish it on the host or route it through nginx (perf audit P13).
  METRICS_PORT: ${METRICS_PORT:-}
  # Report export files (plan 2.9): private volume shared by API and worker, never under /app/uploads
  EXPORT_STORAGE_DIR: /app/storage/exports
  EXPORT_TTL_HOURS: ${EXPORT_TTL_HOURS:-168}
  # Daily retention job (DB-07, runs in the worker): audit request log (audit_logs) and audit trail
  # (audit_log) kept 30 days (owner decision 2026-10-14); raw source observations (raw_observations) kept
  # 1 year and signal samples (measurement_samples) 90 days, both dropped by whole monthly partition
  # (owner decision 2026-10-15). Empty = keep forever.
  AUDIT_REQUEST_LOG_RETENTION_DAYS: ${AUDIT_REQUEST_LOG_RETENTION_DAYS:-30}
  AUDIT_TRAIL_RETENTION_DAYS: ${AUDIT_TRAIL_RETENTION_DAYS:-30}
  RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-365}
  SAMPLE_RETENTION_DAYS: ${SAMPLE_RETENTION_DAYS:-90}
  RETENTION_BATCH: ${RETENTION_BATCH:-1000}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-proact}
    # DB audit F08/F14 (docs/db-audit/AUDIT_REPORT.md): statement statistics, slow-query/lock/temp logging
    # and OLTP-on-SSD planner settings. The dev container proact-postgres carries the same via ALTER SYSTEM.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=0
      - -c
      - log_autovacuum_min_duration=1s
      - -c
      - shared_buffers=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - idle_in_transaction_session_timeout=15min
      - -c
      - jit=off
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # 5433 on the host by default: the shared instrumental-postgres container already owns 5432
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    # API process. The same image runs the worker below (PROCESS_ROLE selects the entrypoint).
    image: proact-backend
    build: *backend-build
    restart: unless-stopped
    # Minimal init as PID 1: forwards signals to node and reaps zombie children so `docker stop` is clean
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      # api = HTTP controllers only; cron jobs (PI scheduler etc.) run in the worker service
      PROCESS_ROLE: api
      PORT: "4004"
      # Pending TypeORM migrations (server/pro-act-backend/src/database/migrations) are applied on boot
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      # Only affects clients calling the backend port directly; the frontend reaches it same-origin via nginx
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8070}
      # Row-level security per request (plan 3.11; on by default, owner decision 2026-10-10)
      DB_RLS_TENANT_BINDING: ${DB_RLS_TENANT_BINDING:-true}
    volumes:
      - uploads:/app/uploads
      - exports:/app/storage/exports
    ports:
      - "${BACKEND_PORT:-4004}:4004"

  worker:
    # Background process: schedulers, connectors and calculations. No HTTP API apart from the probes
    # GET /health/live and /health/ready on WORKER_PORT (4005) inside the container, which the image's
    # role-aware HEALTHCHECK (server/pro-act-backend/docker/healthcheck.js) already polls.
    image: proact-backend
    build: *backend-build
    restart: unless-stopped
    init: true
    depends_on:
      # Waits for the API to be healthy so the schema (migrations) is in place before jobs start
      backend:
        condition: service_healthy
    environment:
      <<: *backend-env
      PROCESS_ROLE: worker
      WORKER_PORT: "4005"
      # The API process owns migrations; two processes must never migrate the same database concurrently
      DB_MIGRATIONS_RUN: "false"
    volumes:
      - uploads:/app/uploads
      - exports:/app/storage/exports

  frontend:
    build:
      context: .
      args:
        # "/api" = same origin (nginx proxies to the backend). Absolute URL only if the backend lives elsewhere.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:4004
      PI_SERVER: ${PI_SERVER:-https://87.107.103.198:7443}
    ports:
      - "${FRONTEND_PORT:-8070}:80"

  kafka:
    # Single-node KRaft broker (no ZooKeeper). Same image line as the host's instrumental-kafka-* cluster.
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT: other containers (kafka:29092). PLAINTEXT_HOST: the host (localhost:${KAFKA_PORT}).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker: every internal topic has replication factor 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      # 9092 is free unless the host's instrumental-kafka-1 container is running; change KAFKA_PORT in that case
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s

  kafka-ui:
    # Optional topic/consumer browser: docker compose --profile tools up -d kafka-ui
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: proact
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      # 8085 on the host: 8080 belongs to the host's instrumental-kafka-ui container
      - "${KAFKA_UI_PORT:-8085}:8080"

  mqtt:
    # Dev broker (docker/mosquitto/mosquitto.conf): anonymous on 1883/9001; password + ACL on 1885 and on the
    # TLS listener 8883 with a committed dev-only self-signed certificate (docker/mosquitto/gen-dev-certs.sh).
    # The host's mosquitto keeps 1883/8883, hence the shifted host ports.
    # 2.1.x is only published as -alpine on Docker Hub (plain 2.1.2 exists only as a local tag on some hosts).
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./docker/mosquitto/acl:/mosquitto/config/acl:ro
      - ./docker/mosquitto/certs:/mosquitto/config/certs:ro
      - mqtt-data:/mosquitto/data
    ports:
      - "${MQTT_PORT:-1884}:1883"
      # MQTT over WebSockets (browser clients)
      - "${MQTT_WS_PORT:-8884}:9001"
      # Password-protected plain listener (dev users proact-test / proact-sim, see docker/mosquitto/passwd)
      - "${MQTT_AUTH_PORT:-1885}:1885"
      # TLS listener; clients trust docker/mosquitto/certs/dev-ca.crt
      - "${MQTT_TLS_PORT:-8885}:8883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 5 -i healthcheck >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 5s

volumes:
  postgres-data:
  uploads:
  exports:
  kafka-data:
  mqtt-data:
