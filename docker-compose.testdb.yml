# Throwaway Postgres for the backend integration tests (DB audit F05, docs/db-audit/AUDIT_REPORT.md).
# The suites recreate the public schema per test file; on the shared dev server that produced checkpoints
# syncing 10k-23k files and stalled the dev database. This instance lives in memory, skips durability
# (fsync off: its data is disposable) and listens on loopback only.
#
#   cd server/pro-act-backend && npm run test:int   # starts it, runs the suites against it
#   npm run testdb:down                             # removes it
services:
  postgres-test:
    image: postgres:15-alpine
    container_name: proact-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proact_test
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_wal_size=2GB
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proact_test"]
      interval: 2s
      timeout: 3s
      retries: 30
