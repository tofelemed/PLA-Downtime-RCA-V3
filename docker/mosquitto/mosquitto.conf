# Mosquitto configuration for the bundled dev broker (docker-compose.yml service "mqtt").
# Development only: anonymous clients may publish and subscribe. Production brokers need
# authentication (password_file / TLS) and must not use this file.

# MQTT over TCP. Published on the host as MQTT_PORT (default 1884; the host's own mosquitto owns 1883).
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets for browser clients. Published on the host as MQTT_WS_PORT (default 8884).
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

# Retained messages and persistent sessions survive restarts (named volume mqtt-data)
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
