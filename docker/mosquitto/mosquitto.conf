# Mosquitto configuration for the bundled dev broker (docker-compose.yml service "mqtt").
# Development only: the plain and WebSocket listeners are anonymous and may publish and subscribe.
# Production brokers need their own authentication (password_file / TLS) and must not use this file.
#
# Listeners (container port -> host port, see .env MQTT_*_PORT):
#   1883 -> 1884   MQTT, anonymous (unchanged dev listener)
#   9001 -> 8884   MQTT over WebSockets, anonymous (browser clients)
#   1885 -> 1885   MQTT, password + ACL (plan 1.8 step 4: wrong-password and read-only ACL tests)
#   8883 -> 8885   MQTT over TLS 1.2+, password + ACL, dev self-signed certificate (certs/, gen-dev-certs.sh)
# Dev users (passwd, acl): proact-test / proact-test-dev (read-only proact/#, test/#),
#                          proact-sim / proact-sim-dev (read-write proact/#, test/#, spike/#).

# password_file / acl_file below apply to the listener they follow (must be the first option; mosquitto 2.1
# logs it as deprecated but there is no other way to keep 1883 anonymous while 1885/8883 check passwords).
per_listener_settings true

# MQTT over TCP. Published on the host as MQTT_PORT (default 1884; the host's own mosquitto owns 1883).
listener 1883 0.0.0.0
protocol mqtt
listener_allow_anonymous true

# MQTT over WebSockets for browser clients. Published on the host as MQTT_WS_PORT (default 8884).
listener 9001 0.0.0.0
protocol websockets
listener_allow_anonymous true

# Password-protected plain listener. Published on the host as MQTT_AUTH_PORT (default 1885).
listener 1885 0.0.0.0
protocol mqtt
listener_allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# TLS listener (IANA secure-mqtt). Published on the host as MQTT_TLS_PORT (default 8885; the host's
# mosquitto owns 8883). Server certificate SAN: localhost, mqtt, proact-mqtt-1, host.docker.internal,
# 127.0.0.1, ::1. Clients trust certs/dev-ca.crt; no client certificate is required.
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/config/certs/dev-ca.crt
certfile /mosquitto/config/certs/dev-server.crt
keyfile /mosquitto/config/certs/dev-server.key
tls_version tlsv1.2
require_certificate false
listener_allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Retained messages and persistent sessions survive restarts (named volume mqtt-data)
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
